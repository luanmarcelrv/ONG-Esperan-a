<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="titulo-educacao">
  <title id="titulo-educacao">Ilustração de livro aberto simbolizando educação</title>
  <rect width="500" height="350" fill="#e8f5e9"/>

  <!-- Livro aberto -->
  <path d="M60 250 L250 220 L440 250 L440 100 L250 130 L60 100 Z" fill="#ffffff" stroke="#2e7d32" stroke-width="6"/>
  <line x1="250" y1="130" x2="250" y2="220" stroke="#2e7d32" stroke-width="6"/>

  <!-- Linhas de texto -->
  <g stroke="#a5d6a7" stroke-width="6" stroke-linecap="round">
    <line x1="90" y1="140" x2="210" y2="150"/>
    <line x1="90" y1="165" x2="210" y2="172"/>
    <line x1="90" y1="190" x2="210" y2="195"/>
    <line x1="290" y1="150" x2="410" y2="140"/>
    <line x1="290" y1="172" x2="410" y2="165"/>
    <line x1="290" y1="195" x2="410" y2="190"/>
  </g>

  <!-- Capelo de formatura -->
  <g transform="translate(250 60)">
    <polygon points="-70,0 0,-30 70,0 0,30" fill="#1b5e20"/>
    <rect x="-14" y="0" width="28" height="16" fill="#1b5e20"/>
    <circle cx="0" cy="-30" r="6" fill="#ff8f00"/>
    <line x1="55" y1="-5" x2="70" y2="40" stroke="#ff8f00" stroke-width="4"/>
    <circle cx="70" cy="46" r="6" fill="#ff8f00"/>
  </g>
</svg>
